name: Сборка и тесты .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Сборка и тесты
    runs-on: windows-latest

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Настройка .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Восстановление пакетов
        run: dotnet restore .\VibeEngine2.sln

      - name: Сборка Release
        run: dotnet build .\VibeEngine2.sln --configuration Release --no-restore

      - name: Запуск тестов
        run: dotnet test .\VibeEngine2.sln --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
