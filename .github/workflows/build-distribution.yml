name: Build and Release Distribution

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка, тег или commit для сборки"
        required: true
        default: master
        type: string
      release_tag:
        description: "Тег релиза, например v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-distribution-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-distribution:
    name: Build Windows distribution
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Настройка .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Публикация Editor.Sandbox
        run: >-
          dotnet publish .\Editor.Sandbox\Editor.Sandbox.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output .\artifacts\distribution\Editor.Sandbox
      - name: Подготовка runtime для создания игровых проектов
        shell: pwsh
        run: |
          $runtimeDestination = `
            ".\artifacts\distribution\Editor.Sandbox\EngineRuntime\win-x64"

          New-Item `
            -ItemType Directory `
            -Path $runtimeDestination `
            -Force | Out-Null

          dotnet publish `
            .\Engine.Hosting.Desktop\Engine.Hosting.Desktop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            "-p:CopyLocalLockFileAssemblies=true" `
            --output $runtimeDestination

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish the engine runtime."
          }

          # Engine.Serialization and Engine.Input.SilkNet are used directly
          # by generated game projects but are not both transitive dependencies
          # of Engine.Hosting.Desktop. Publish them and merge their DLLs.
          $extraPublishRoot = Join-Path $env:RUNNER_TEMP "VibeEngine2RuntimeExtra"

          try {
            New-Item `
              -ItemType Directory `
              -Path $extraPublishRoot `
              -Force | Out-Null

            $extraProjects = @(
              ".\Engine.Serialization\Engine.Serialization.csproj"
              ".\Engine.Input.SilkNet\Engine.Input.SilkNet.csproj"
              ".\Engine.Hosting\Engine.Hosting.csproj"
              ".\Engine.Localization\Engine.Localization.csproj"
              ".\Engine.Navigation\Engine.Navigation.csproj"
            )

            foreach ($projectPath in $extraProjects) {
              $projectName = [System.IO.Path]::GetFileNameWithoutExtension($projectPath)
              $projectOutput = Join-Path $extraPublishRoot $projectName

              New-Item `
                -ItemType Directory `
                -Path $projectOutput `
                -Force | Out-Null

              dotnet publish `
                $projectPath `
                --configuration Release `
                --runtime win-x64 `
                --self-contained false `
                "-p:CopyLocalLockFileAssemblies=true" `
                --output $projectOutput

              if ($LASTEXITCODE -ne 0) {
                throw "Failed to publish $projectName."
              }

              Get-ChildItem `
                -LiteralPath $projectOutput `
                -Filter "*.dll" `
                -File |
                ForEach-Object {
                  Copy-Item `
                    -LiteralPath $_.FullName `
                    -Destination $runtimeDestination `
                    -Force
                }
            }
          }
          finally {
            if (Test-Path -LiteralPath $extraPublishRoot) {
              Remove-Item `
                -LiteralPath $extraPublishRoot `
                -Recurse `
                -Force
            }
          }

          $requiredAssemblies = @(
            "Engine.Hosting.Desktop.dll"
            "Engine.Runtime.dll"
            "Engine.Graphics.OpenGL.dll"
            "Engine.Audio.OpenAL.dll"
            "Engine.Serialization.dll"
            "Engine.Graphics2D.dll"
            "Engine.Input.SilkNet.dll"
            "Engine.Hosting.dll"
            "Engine.Localization.dll"
            "Engine.Navigation.dll"
          )

          $missingAssemblies = @(
            $requiredAssemblies | Where-Object {
              -not (
                Test-Path -LiteralPath (
                  Join-Path $runtimeDestination $_
                ) -PathType Leaf
              )
            }
          )

          if ($missingAssemblies.Count -gt 0) {
            throw (
              "Runtime package is incomplete: " +
              ($missingAssemblies -join ", ")
            )
          }

          Write-Host "Engine runtime package prepared successfully."
      - name: Публикация Game.Sandbox
        run: >-
          dotnet publish .\Game.Sandbox\Game.Sandbox.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output .\artifacts\distribution\Game.Sandbox

      - name: Подготовка инструкции
        shell: pwsh
        run: |
          @"
          VibeEngine2 - Windows x64 distribution

          Editor:
            Editor.Sandbox\Editor.Sandbox.exe

          Game sandbox:
            Game.Sandbox\Game.Sandbox.exe

          Requirements:
            - Windows x64
            - .NET 8 Desktop Runtime (x64)
            - Graphics and audio drivers required by your system

          This is a framework-dependent development build.
          No source code or editor development files are included.

          Source ref: ${{ inputs.ref }}
          Release tag: ${{ inputs.release_tag }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "@ | Set-Content -Path .\artifacts\distribution\README.txt -Encoding utf8

      - name: Создание ZIP-архива
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null
          Compress-Archive `
            -Path .\artifacts\distribution\* `
            -DestinationPath .\artifacts\VibeEngine2-Windows-x64.zip `
            -CompressionLevel Optimal

      - name: Загрузка готовой сборки в Actions
        uses: actions/upload-artifact@v6
        with:
          name: VibeEngine2-Windows-x64
          path: .\artifacts\VibeEngine2-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Публикация GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ inputs.ref }}
          name: VibeEngine2 ${{ inputs.release_tag }}
          generate_release_notes: true
          files: .\artifacts\VibeEngine2-Windows-x64.zip
          fail_on_unmatched_files: true
