name: .NET CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\VibeEngine2.sln

      - name: Build
        run: dotnet build .\VibeEngine2.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\VibeEngine2.sln --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
